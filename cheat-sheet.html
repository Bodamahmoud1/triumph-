<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Quick Reference Cheat Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; margin: 0; padding: 20px; background: #fff; color: #333; }
        .en { font-family: 'Outfit', sans-serif; }
        h1 { text-align: center; color: #0f1e42; border-bottom: 2px solid #c5a05a; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; page-break-inside: avoid; }
        .card h2 { margin: 0 0 10px 0; color: #fff; padding: 8px; border-radius: 4px; text-align: center; }
        .theme-blue { background: #3498db; }
        .theme-red { background: #e74c3c; }
        .theme-green { background: #2ecc71; }
        .theme-yellow { background: #f1c40f; color: #333 !important; }
        .theme-gold { background: #d4af37; color: #fff !important; }
        .theme-purple { background: #9b59b6; }
        .theme-orange { background: #e67e22; }
        .theme-pink { background: #e84393; }
        .theme-teal { background: #1abc9c; }
        .theme-dark { background: #34495e; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 6px; font-size: 14px; text-align: right; }
        th { background: #f9f9f9; width: 40%; }
        @media print {
            body { font-size: 12pt; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card { border: 2px solid #ddd; }
            @page { size: A4 portrait; margin: 10mm; }
        }
    </style>
</head>
<body>
    <h1>المرجع السريع لكيماويات الغسيل <br><small class="en">Laundry Chemicals Cheat Sheet</small></h1>
    <div id="cheat-sheet-grid" class="grid"></div>

    <script>
        fetch('data/chemicals.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('cheat-sheet-grid');
                data.forEach(chem => {
                    let themeClass = 'theme-dark';
                    switch(chem.theme) {
                        case 'red': themeClass = 'theme-red'; break;
                        case 'green': themeClass = 'theme-green'; break;
                        case 'yellow': themeClass = 'theme-yellow'; break;
                        case 'gold': themeClass = 'theme-gold'; break;
                        case 'purple': themeClass = 'theme-purple'; break;
                        case 'orange': themeClass = 'theme-orange'; break;
                        case 'blue': themeClass = 'theme-blue'; break;
                        case 'pink': themeClass = 'theme-pink'; break;
                        case 'teal': themeClass = 'theme-teal'; break;
                    }
                    
                    const dosageText = chem.usage && chem.usage.dosage ? chem.usage.dosage : '-';
                    const phText = chem.technical && chem.technical.ph ? chem.technical.ph : '-';
                    const typeText = chem.type || '-';
                    const descText = chem.description || '-';

                    grid.innerHTML += `
                        <div class="card">
                            <h2 class="${themeClass} en">${chem.name} - ${chem.code}</h2>
                            <table>
                                <tr><th>النوع</th><td>${typeText}</td></tr>
                                <tr><th>الوظيفة الأساسية</th><td>${descText}</td></tr>
                                <tr><th>الجرعة</th><td>${dosageText}</td></tr>
                                <tr><th>الـ pH</th><td class="en">${phText}</td></tr>
                            </table>
                        </div>
                    `;
                });
            })
            .catch(err => {
                console.error("Error loading chemicals data:", err);
                const grid = document.getElementById('cheat-sheet-grid');
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; background: #ffebee; color: #c62828; padding: 20px; border-radius: 8px; border: 1px solid #ef9a9a; text-align: center;">
                        <h3 style="margin-top: 0;">عذراً، لم نتمكن من تحميل البيانات ❌</h3>
                        <p>يبدو أنك قمت بفتح الملف مباشرة من جهازك (بصيغة <code>file:///</code>). متصفح الويب يمنع تحميل ملفات البيانات (JSON) لأسباب أمنية في هذه الحالة.</p>
                        <p><strong>الحل:</strong> يرجى فتح الصفحة من خلال الخادم المحلي (Local Server) الخاص بالتطبيق، على سبيل المثال: <br><code style="font-size: 16px; background: #fff; padding: 5px 10px; border-radius: 4px; display: inline-block; margin-top: 10px;">http://localhost:3000/cheat-sheet.html</code></p>
                    </div>
                `;
            });
    </script>
</body>
</html>

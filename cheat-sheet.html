<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Quick Reference Cheat Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; margin: 0; padding: 20px; background: #fff; color: #333; }
        .en { font-family: 'Outfit', sans-serif; }
        h1 { text-align: center; color: #0f1e42; border-bottom: 2px solid #c5a05a; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; page-break-inside: avoid; }
        .card h2 { margin: 0 0 10px 0; color: #fff; padding: 8px; border-radius: 4px; text-align: center; }
        .theme-blue { background: #3498db; }
        .theme-red { background: #e74c3c; }
        .theme-green { background: #2ecc71; }
        .theme-yellow { background: #f1c40f; color: #333 !important; }
        .theme-purple { background: #9b59b6; }
        .theme-orange { background: #e67e22; }
        .theme-teal { background: #1abc9c; }
        .theme-dark { background: #34495e; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 6px; font-size: 14px; text-align: right; }
        th { background: #f9f9f9; width: 40%; }
        @media print {
            body { font-size: 12pt; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card { border: 2px solid #ddd; }
            @page { size: A4 portrait; margin: 10mm; }
        }
    </style>
</head>
<body>
    <h1>المرجع السريع لكيماويات الغسيل <br><small class="en">Laundry Chemicals Cheat Sheet</small></h1>
    <div id="cheat-sheet-grid" class="grid"></div>

    <script>
        fetch('data/chemicals.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('cheat-sheet-grid');
                data.forEach(chem => {
                    let themeClass = 'theme-blue';
                    if(chem.theme === 'red') themeClass = 'theme-red';
                    if(chem.theme === 'green') themeClass = 'theme-green';
                    if(chem.theme === 'yellow') themeClass = 'theme-yellow';
                    if(chem.theme === 'purple') themeClass = 'theme-purple';
                    if(chem.theme === 'orange') themeClass = 'theme-orange';
                    
                    grid.innerHTML += `
                        <div class="card">
                            <h2 class="${themeClass} en">${chem.name} - ${chem.code}</h2>
                            <table>
                                <tr><th>النوع</th><td>${chem.type_ar}</td></tr>
                                <tr><th>الوظيفة الأساسية</th><td>${chem.description.substring(0, 100)}...</td></tr>
                                <tr><th>الجرعة (خفيفة)</th><td class="en">${chem.dosage.light || '-'} ml/kg</td></tr>
                                <tr><th>الجرعة (متوسطة)</th><td class="en">${chem.dosage.medium || '-'} ml/kg</td></tr>
                                <tr><th>الجرعة (شديدة)</th><td class="en">${chem.dosage.heavy || '-'} ml/kg</td></tr>
                            </table>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
